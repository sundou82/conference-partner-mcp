name: Sync API spec

# The files in spec/ are generated by the server, never hand-edited here. This job
# re-fetches them so the repo cannot drift from the deployed API. All three are
# discovery surfaces and cost no request quota.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: |
          # --retry-all-errors is load-bearing, not belt-and-braces: curl's own
          # "transient error" set is 408/429/500/502/503/504, and the API sits
          # behind Cloudflare, which reports a momentary origin stall as 520.
          # Without this flag --retry never fires on the one code we actually
          # see, and a two-second hiccup fails the whole day's sync.
          # The cost is that a real 404 is also retried three times before it
          # fails — 15 wasted seconds on a run that was doomed anyway.
          curl -sSf --retry 3 --retry-delay 5 --retry-all-errors -o raw-openapi.json \
            -H 'Accept: application/json' \
            https://www.myhuiban.com/api/openapi.json
          curl -sSf --retry 3 --retry-delay 5 --retry-all-errors -o raw-tools.json \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            https://www.myhuiban.com/mcp
          curl -sSf --retry 3 --retry-delay 5 --retry-all-errors -o raw-card.json \
            https://www.myhuiban.com/.well-known/mcp/server-card.json

      - name: Normalise and verify
        run: python3 scripts/sync_spec.py

      - name: Commit if changed
        run: |
          if git diff --quiet spec/; then
            echo "spec unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/
          git commit -m 'chore(spec): sync from production'
          # Same-branch race with the snapshot job — see snapshot.yml.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "still could not push after 3 attempts"
          exit 1
