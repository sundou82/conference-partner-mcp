name: Sync API spec

# The files in spec/ are generated by the server, never hand-edited here. This job
# re-fetches them so the repo cannot drift from the deployed API. All three are
# discovery surfaces and cost no request quota.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: |
          curl -sSf --retry 3 --retry-delay 5 -o raw-openapi.json \
            -H 'Accept: application/json' \
            https://www.myhuiban.com/api/openapi.json
          curl -sSf --retry 3 --retry-delay 5 -o raw-tools.json \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            https://www.myhuiban.com/mcp
          curl -sSf --retry 3 --retry-delay 5 -o raw-card.json \
            https://www.myhuiban.com/.well-known/mcp/server-card.json

      - name: Normalise and verify
        run: python3 scripts/sync_spec.py

      - name: Commit if changed
        run: |
          if git diff --quiet spec/; then
            echo "spec unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/
          git commit -m 'chore(spec): sync from production'
          git push
